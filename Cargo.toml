[workspace]
members = ["crates/silent-transform", "crates/silent-node"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
silent-transform = { path = "crates/silent-transform" }
swc_core = { version = "84.0.2", features = [
  "base",
  "base_node",
  "common",
  "common_concurrent",
  "ecma_ast",
  "ecma_ast_serde",
  "ecma_helpers_inline",
  "ecma_codegen",
  "ecma_parser",
  "ecma_parser_typescript",
  "ecma_transforms",
  "ecma_transforms_typescript",
  "ecma_transforms_proposal",
  "ecma_transforms_compat",
  "ecma_transforms_react",
  "ecma_minifier",
  "ecma_quote",
  "ecma_utils",
  "ecma_visit",
  "allocator_node"
] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
