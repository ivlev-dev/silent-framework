<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Silent UI — пример</title>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("sui-theme");
          } catch (error) {}
          var theme =
            stored === "light" || stored === "dark" || stored === "auto"
              ? stored
              : "auto";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
