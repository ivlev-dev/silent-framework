[package]
name = "silent-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binary Silent protocol for Rust: derive-based schema, compact wire format, bitmap optionals, collections and oneof"
repository = "https://github.com/ivlev-dev/silent-framework"
readme = "README.md"
keywords = ["serialization", "protocol", "encoding", "binary", "derive"]
categories = ["encoding", "data-structures"]

[dependencies]
bytes = "1"
silent-protocol-macros = { path = "../silent-protocol-macros" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
