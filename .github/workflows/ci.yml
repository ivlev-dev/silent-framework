name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p silent-transform -p silent-node --all-targets -- -D warnings
      - run: cargo test -p silent-transform

  # Основной набор проверок: сборка, типы, юнит-тесты. Node 22 — нижняя
  # поддерживаемая версия (engines >=22), Node 26 — основная. TypeScript 7
  # и Vitest 5 работают на обеих версиях, поэтому отдельного Node 26-only
  # шага здесь не требуется.
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
        if: matrix.node == 26
      - run: pnpm coverage:packages
        if: matrix.node == 26
      - run: pnpm api:check
      - run: pnpm api:check:self
      - run: pnpm install:check
      - run: pnpm consumer:check

  # SSR, примеры, упаковка и бенчмарки — только на основной версии Node,
  # чтобы не дублировать тяжёлые шаги в матрице.
  ssr:
    name: ssr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @ivlev-dev/silent-example-counter build
      - run: pnpm --filter @ivlev-dev/silent-example-ssr-counter build
      - run: pnpm --filter @ivlev-dev/silent-example-ssr-pool build
      - run: pnpm --filter @ivlev-dev/silent-example-router build
      - run: pnpm --filter @ivlev-dev/silent-example-forms build
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:ssr
      - run: pnpm test:ssr-pool
      - run: pnpm pack:check
      # --strict обязателен для CI-гейта: без него шумные метрики (ops, ratio)
      # печатаются как предупреждения и не валят сборку.
      - run: pnpm bench:guard --only=build --strict
      # Шаг --only=browser вернётся после замера browser-бенчмарка на раннере
      # и добавления секции browser в scripts/bench-baseline.json: сейчас
      # baseline.browser нет, и bench-guard с --only=browser обязан падать.

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright-core install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e
        env:
          SILENT_E2E_BROWSER: ${{ matrix.browser }}
      # SSR-гидрация в каждом браузере матрицы. Chromium и Firefox
      # проверены локально; webkit в CI не блокирует сборку (нужны
      # системные библиотеки, локально проверить не удалось).
      - run: pnpm test:ssr
        env:
          SILENT_E2E_BROWSER: ${{ matrix.browser }}
        continue-on-error: ${{ matrix.browser == 'webkit' }}

  # Windows проверяет только типы: юнит-тесты и e2e требуют нативного SWC
  # аддона и браузеров, поэтому здесь не собираем native-скрипты.
  windows:
    name: typecheck (windows, node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tsc
      - run: pnpm typecheck

  # PHP-реализация протокола: атрибуты + рефлексия, без внешних зависимостей.
  # Тесты — plain runner (php tests/run.php), поэтому PHPUnit и `composer install`
  # не нужны; `composer validate` проверяет только манифест.
  php:
    name: php
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
