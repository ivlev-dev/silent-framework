name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ivlev-dev/silent-swc build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: packages/swc/native/*.node
          if-no-files-found: error

  publish:
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches package versions and lockfile
        run: node scripts/verify-versions.mjs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/swc/native
          merge-multiple: true
      - run: pnpm build
      - run: pnpm typecheck
      - run: cargo fmt --all -- --check
      - run: cargo test -p silent-transform
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm api:check:self
      - run: pnpm pack:check
      - run: pnpm install:check
      - run: pnpm consumer:check
      - run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify all packages are published
        run: pnpm published:check
        timeout-minutes: 15
